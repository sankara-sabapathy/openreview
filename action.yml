name: "OpenReview AI"
description: "Free BYOK multi-provider multi-agent PR review. Configure via .github/openreview.yml"
author: "OpenReview"
branding:
  icon: "eye"
  color: "blue"
inputs:
  github-token:
    description: "GITHUB_TOKEN for posting comments/checks"
    required: true
    default: ${{ github.token }}
  config-path:
    description: "Path to config file"
    required: false
    default: ".github/openreview.yml"
  anthropic-api-key:
    description: "BYOK: Anthropic API key (Claude)"
    required: false
    default: ""
  openai-api-key:
    description: "BYOK: OpenAI API key (Codex)"
    required: false
    default: ""
  opencode-api-key:
    description: "BYOK: OpenCode / Zen API key"
    required: false
    default: ""
  opencode-base-url:
    description: "OpenCode base URL (Go subscription default; Zen pay-as-you-go: https://opencode.ai/zen/v1)"
    required: false
    default: "https://opencode.ai/zen/go/v1"
  dry-run:
    description: "If true, log verdict without posting"
    required: false
    default: "false"
  allowed-author-associations:
    description: "Comma-separated GitHub author_association values allowed to trigger a review via comment (issue_comment only). Empty = OWNER,MEMBER,COLLABORATOR (i.e. anyone with write access)."
    required: false
    default: ""
  log-level:
    description: "Log verbosity: debug, info (default), warn, error"
    required: false
    default: "info"
outputs:
  verdict:
    description: "Global verdict: approve|comment|request_changes"
    value: ${{ steps.review.outputs.verdict }}
  review_status:
    description: "Run status: ok (all reviews ran) | partial (some produced no usable result) | error (nothing was reviewed — verdict is NOT a pass)"
    value: ${{ steps.review.outputs.review_status }}
runs:
  using: "node24"
  main: "dist/index.js"

name: OpenReview
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  review:
    # issue_comment runs in the BASE repo, so the secrets are live. Gate the
    # sender on write access (author_association) so no random commenter can
    # spend the maintainer's provider budget.
    # The command match stays a cheap pre-filter: `trim()` does not exist in
    # the Actions expression language, and the action itself enforces the EXACT
    # command (defaults.command) plus this same association check.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.sender.type != 'Bot' &&
      (github.event.comment.author_association == 'OWNER' ||
      github.event.comment.author_association == 'MEMBER' ||
      github.event.comment.author_association == 'COLLABORATOR') &&
      contains(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Final commit before merge: back to the published action (AGENTS.md
      # convention). The previous commit used `uses: ./` so the dogfood review
      # exercised this branch instead of the last release.
      - uses: sankara-sabapathy/openreview@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config-path: .github/openreview.yml
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          opencode-api-key: ${{ secrets.OPENCODE_API_KEY }}
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Workflow syntax gate. A bad expression (e.g. calling a function that does
  # not exist in the Actions expression language) does NOT fail `ci` — it only
  # shows as a 0s red run in the Actions tab, which is easy to miss. Since the
  # trigger is what gates who can spend the repo's API budget, lint it.
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/actionlint@v1.7.12

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run package
      - name: Check dist/ has no stray chunks (ncc must emit a single index.js)
        run: |
          extra=$(ls dist/*.js | grep -v 'dist/index.js' || true)
          if [ -n "$extra" ]; then echo "::error::stray bundle chunks: $extra. Remove them; dist/ must be single-file."; exit 1; fi
      - name: Check dist/ is committed and fresh
        run: git diff --exit-code -- dist/ || (echo "::error::dist/ is stale. Run npm run build && npm run package and commit." && exit 1)
      - run: node dist-src/validate.js openreview.example.yml

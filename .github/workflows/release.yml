name: Release
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          # PRs opened with the default GITHUB_TOKEN do not trigger workflows,
          # so release PRs merged with no CI (0-job runs on the 0.17.0 PR).
          # A PAT or GitHub App token in RELEASE_PLEASE_TOKEN fixes that; the
          # fallback keeps releases working until the secret exists.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
  move-major:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move floating tags (v0, v1) to the release
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }} # e.g. v0.17.0
        run: |
          # Docs and README tell users to pin @v1, but releases are still v0.x,
          # so the major-from-tag rule alone only ever moved v0 and left v1
          # stale (v1 sat on v0.13.0 through 0.17.0). Move both.
          MAJOR=$(echo "$TAG" | cut -d. -f1)
          git fetch --tags
          for t in $(printf '%s\n' "$MAJOR" v1 | sort -u); do
            git tag -f "$t" "$TAG"
            git push origin "refs/tags/$t" --force
          done

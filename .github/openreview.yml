# TEMPORARY (feature-branch live proof for #19): this repo's reviews expressed
# via extends. Reverted to the explicit showcase before merge (AGENTS.md rule).
version: 1
requires_action: ">=0.3.0"
extends:
  - openreview/general@0.7.0
providers:
  opencode:
    kind: opencode
    protocol: openai-chat
    model: glm-5.3-flash
    base_url: https://opencode.ai/zen/go/v1
    key_from: secrets.OPENCODE_API_KEY
reviews:
  - id: general-quality
    main:
      provider: opencode
      instructions: "Synthesize findings. Strict on bugs, lenient on style."
    subagents:
      - name: correctness
        provider: opencode
        instructions: "Bugs, races, missing tests."
    verdict:
      mode: comment
      min_severity: medium
      post_inline: true
      deduplicate: true

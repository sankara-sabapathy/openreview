# OpenReview reference config — this file is the live showcase for anyone using
# OpenReview. Rule (see AGENTS.md): it must demonstrate every available field and
# stay in sync with src/config.ts. Fields not needed for this repo's own reviews
# are shown commented out. Validate with: node dist-src/validate.js .github/openreview.yml
version: 1

# Optional floor for the running action release. The workflow `uses:` ref selects
# the release; this only fails fast when the runner is older than the config needs.
requires_action: ">=0.3.0"

# Template inheritance (see website/docs/templates). This repo stays fully
# explicit as the canonical showcase, but any consumer can replace the whole
# file below with:
# extends: [openreview/general@0.7.0, openreview/security@0.7.0]
# plus their own providers: block. Remote community templates pin a commit SHA:
# extends: [github:acme-corp/review-standards/backend@sha:abc123...]

defaults:
  # Event triggers live in the WORKFLOW (.github/workflows/ai-review.yml),
  # not here.
  command: "/review"
  lang: en
  ignore: ["**.lock", "dist/**", "website/build/**"]
  max_diff_chars: 80000
  # Wall-clock budget for the whole run (30-14400, default 1200). Once spent, no
  # new agent call starts and the rest report `budget-exhausted` instead of
  # voting. Worst case used to be reviews x agents x (1+retries) x timeout_s.
  max_runtime_s: 1200
  # Agents in flight per review (1-32, default 4). Unbounded fan-out rate-limits
  # small providers and turns a retry wave into a 429 storm.
  max_concurrency: 4
  # Cross-file context budget + noise defaults (commented = defaults shown).
  # max_context_chars: 20000
  # include_full_files: true
  # profile: balanced # quiet | balanced | assertive
  # min_confidence: 0.6
  # max_findings: 10

providers:
  # --- Active: OpenCode Go, free tier ---
  # This repo reviews itself with `space-bunny-free`. Go ships exactly two free
  # models; the other one, `longcat-2.5-preview-free`, was tried first and
  # REJECTED for review work:
  #   * it answers a full-size diff with 7-8k chars of markdown prose and no
  #     JSON at all, so every agent reported "unusable response" -> zero findings
  #   * it ignores `response_format: {type: json_object}`, so `json_mode` cannot
  #     save it, and neither could a much harder prompt instruction
  # Both are reasoning models; the difference is that space-bunny-free honours
  # the JSON contract on a real diff while longcat does not. Verify a model
  # before trusting it: `npm run probe:model <id>` (needs OPENCODE_API_KEY).
  #
  # Deepseek/GLM/Kimi etc. are available on the same subscription — see
  # website/docs/providers/opencode-go.md and openreview.example.yml for the
  # full provider matrix. Only the model this repo actually uses is configured.
  opencode:
    # kind: is a deprecated shorthand (anthropic|openai|opencode|openai-compatible).
    # Prefer protocol below; both are shown here for reference.
    kind: opencode
    protocol: openai-chat # openai-chat | anthropic-messages
    model: space-bunny-free
    base_url: https://opencode.ai/zen/go/v1
    key_from: secrets.OPENCODE_API_KEY # any $NAME: "secrets.FOO" | "env.FOO"
    # json_mode stays TRUE (the default). Turning it off removes
    # `response_format: {type: json_object}`, and a model that ignores the
    # "JSON only" instruction then answers in markdown, which is unusable. Only
    # disable it for a provider that genuinely rejects response_format.
    # auth: { header: Authorization, scheme: Bearer } # defaults shown; Azure uses { header: api-key, scheme: "" }
    # headers: { X-Custom: value } # extra headers merged into every request
    # endpoint_path: /chat/completions # default per protocol (/chat/completions, /v1/messages)
    # json_mode: true # set false ONLY for providers that reject response_format
    # extra_body: { temperature: 0.1 } # extra JSON body fields merged into requests
    # Reasoning models spend their thinking from the 2000-token output budget:
    # on a large diff space-bunny-free thinks ~9.5k chars, hits
    # finish_reason=length with empty content, and both agents end unparseable
    # (measured 0/5 parseable; a bigger cap does NOT help — thinking expands to
    # fill it, 0/2 at 8000). Capping the thinking fixes it (2/2 parseable with
    # real findings on the same 80k-char diff), so this stays active.
    extra_body: { reasoning_effort: "low" }
    # retries: 2 # attempts after the first for empty/5xx/429/network (0-5)
    # timeout_s: 420 # per-attempt TOTAL cap in seconds (10-600); 90s idle + 60s/1KB trickle guards always on
    # Named per-model overrides sharing this entry's transport + credential
    # (agents use `provider: opencode.flash`). Each entry merges over the base;
    # only set keys win, so `{ model: ... }` alone keeps base retries/timeout.
    # models:
    #   flash:
    #     model: deepseek-v4-flash
    #   free:
    #     model: longcat-2.5-preview-free
    #     json_mode: false

  # --- Commented examples: any provider works with protocol + base_url + key_from + model ---
  # Claude subscription (Pro/Max/…): `claude setup-token` → secret → step env.
  # The explicit auth block forces Bearer (without it, x-api-key is assumed).
  # claude-subscription:
  #   protocol: anthropic-messages
  #   model: claude-sonnet-5
  #   key_from: secrets.CLAUDE_CODE_OAUTH_TOKEN
  #   auth: { header: Authorization, scheme: Bearer }
  #   headers: { anthropic-beta: oauth-2025-04-20 }
  # claude:
  #   protocol: anthropic-messages
  #   model: claude-sonnet-5
  #   key_from: secrets.ANTHROPIC_API_KEY
  # codex:
  #   protocol: openai-chat
  #   model: gpt-5.3-codex
  #   base_url: https://api.openai.com/v1
  #   key_from: secrets.OPENAI_API_KEY
  # groq:
  #   protocol: openai-chat
  #   model: llama-3.3-70b-versatile
  #   base_url: https://api.groq.com/openai/v1
  #   key_from: secrets.GROQ_API_KEY
  #   json_mode: false
  # azure:
  #   protocol: openai-chat
  #   model: my-deployment
  #   base_url: https://RESOURCE.openai.azure.com/openai/deployments/my-deployment
  #   key_from: secrets.AZURE_OPENAI_KEY
  #   auth: { header: api-key, scheme: "" }

reviews:
  # --- Active review: everything in this repo gets the general pass ---
  - id: general-quality
    if_paths: ["**"]
    strategy: any # any | all | majority: per-provider ballots; see website/docs/multi-review
    # Noise controls (issue #21): profile preset + explicit overrides (win).
    # quiet: high-confidence top-3 · balanced (default): passthrough ·
    # assertive: everything up to 100.
    # profile: balanced
    # min_confidence: 0.6
    # max_findings: 10
    # suppress: ["decided-pattern"] # rebutted items that must not resurrect (regex, file + comment)
    # Cross-file context: full changed files + call-site excerpts automatic
    # (bounded by max_context_chars below); add explicit files when needed:
    # context_files: ["src/config.ts"]
    # include_full_files: true
    # max_context_chars: 20000
    main:
      # name: defaults to "<review-id>:main"
      provider: opencode
      instructions: "Synthesize findings. Strict on bugs, lenient on style."
    subagents:
      - name: correctness
        provider: opencode
        instructions: "Bugs, races, missing tests."
    verdict:
      mode: comment # comment | approve | request_changes
      min_severity: medium # suggestion | medium | high
      post_inline: true
      deduplicate: true

  # --- Commented example: scoped strict review with a blocking verdict ---
  # - id: security-strict
  #   if_paths: ["auth/**", "api/**", "payments/**", "src/**"]
  #   main:
  #     provider: codex
  #     instructions: "Staff security reviewer. OWASP, authz, injection, secrets. High-confidence findings only."
  #   subagents:
  #     - name: secrets-scan
  #       provider: opencode
  #       instructions: "Find leaked secrets, hardcoded credentials, overly broad permissions."
  #   verdict:
  #     mode: request_changes
  #     min_severity: high
  #     post_inline: true

global_verdict:
  strategy: any_blocking # any_blocking | max_severity | majority
  sticky_comment: true
  # sticky_comment_mode: append # update (default): replace the sticky each run | append: keep a per-run history in one comment
  fail_check_on_request_changes: false

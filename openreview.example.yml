version: 1
# Optional: fail fast if the running action release is older than this.
# The workflow ref (uses: ...@v1) selects the release; this is only a floor check.
# requires_action: ">=0.3.0"

# Inherit shared config instead of writing everything (see website/docs/templates).
# Templates resolve in order; this file overlays on top (child wins).
# extends:
#   - openreview/general@0.7.0
#   - openreview/security@0.7.0

defaults:
  on: [opened, synchronize, ready_for_review]
  command: "/review"
  draft: false
  lang: en
  ignore: ["**.lock", "dist/**", "*.snap", "package-lock.json"]
  max_diff_chars: 80000

providers:
  claude:
    kind: anthropic
    model: claude-sonnet-5
    key_from: secrets.ANTHROPIC_API_KEY
  codex:
    kind: openai
    model: gpt-5.3-codex
    key_from: secrets.OPENAI_API_KEY
  opencode:
    kind: opencode
    model: big-pickle
    key_from: secrets.OPENCODE_API_KEY
    base_url: https://opencode.ai/zen/v1 # Go subscription: https://opencode.ai/zen/go/v1 (models: glm-5.3-flash, kimi-k2.7-code, ...)
    # retries: 2 # retry budget for empty/5xx/429/network (0-5, default 2)
    # timeout_s: 420 # per-attempt TOTAL cap, seconds (default 420); 90s idle watchdog always on
  # Claude subscription (Pro/Max/Team/Enterprise) via OAuth instead of API key:
  # mint with `claude setup-token` (1-year token, sk-ant-oat01-…), store as a
  # secret, and pass it through the workflow step's `env:`. The explicit auth
  # block is honored literally (Bearer); without it, x-api-key is assumed.
  # claude-subscription:
  #   protocol: anthropic-messages
  #   model: claude-sonnet-5
  #   key_from: secrets.CLAUDE_CODE_OAUTH_TOKEN
  #   auth: { header: Authorization, scheme: Bearer }
  #   headers: { anthropic-beta: oauth-2025-04-20 }
  # Any OpenAI-compatible provider works with protocol + base_url + key_from + model:
  groq:
    protocol: openai-chat
    model: llama-3.3-70b-versatile
    base_url: https://api.groq.com/openai/v1
    key_from: secrets.GROQ_API_KEY
  # Azure OpenAI uses an api-key header with no scheme:
  azure:
    protocol: openai-chat
    model: my-deployment
    base_url: https://RESOURCE.openai.azure.com/openai/deployments/my-deployment
    key_from: secrets.AZURE_OPENAI_KEY
    auth: { header: api-key, scheme: "" }

reviews:
  - id: security-strict
    if_paths: ["auth/**", "api/**", "payments/**", "src/**"]
    strategy: any
    main:
      provider: codex
      instructions: "Staff security reviewer. Focus on OWASP, authz, injection, secrets. Only high-confidence findings."
    subagents:
      - name: secrets-scan
        provider: opencode
        instructions: "Find leaked secrets, hardcoded credentials, overly broad permissions."
      - name: logic-check
        provider: codex
        instructions: "Check auth flows, edge cases, error handling."
    verdict:
      mode: request_changes
      min_severity: high
      post_inline: true

  - id: general-quality
    if_paths: ["**"]
    strategy: majority
    # Cross-file context (see website/docs/configuration): full changed files +
    # call-site excerpts are automatic (bounded by max_context_chars); add more:
    # context_files: ["src/types.ts", "db/schema.sql"]
    # include_full_files: true
    # max_context_chars: 20000
    main:
      provider: claude
      instructions: "Synthesize sub-agent findings. Strict on bugs and correctness, lenient on style. Deduplicate."
    subagents:
      - name: correctness
        provider: claude
        instructions: "Bugs, race conditions, null handling, missing tests."
      - name: performance
        provider: opencode
        instructions: "N+1 queries, hot loops, unnecessary allocations, bundle size."
    verdict:
      mode: comment
      min_severity: medium
      post_inline: true
      deduplicate: true

global_verdict:
  strategy: any_blocking
  sticky_comment: true
  fail_check_on_request_changes: false

version: 1
# Optional: fail fast if the running action release is older than this.
# The workflow ref (uses: ...@v1) selects the release; this is only a floor check.
# requires_action: ">=0.3.0"

# Inherit shared config instead of writing everything (see website/docs/templates).
# Templates resolve in order; this file overlays on top (child wins).
# extends:
#   - openreview/general@0.7.0
#   - openreview/security@0.7.0

defaults:
  # Event triggers live in the WORKFLOW (on: pull_request: types:),
  # not here — see .github/workflows/ai-review.yml.
  command: "/review"
  lang: en
  ignore: ["**.lock", "dist/**", "*.snap", "package-lock.json"]
  max_diff_chars: 80000
  max_runtime_s: 1200 # wall-clock budget for the whole run (30-14400)
  max_concurrency: 4 # agents in flight per review (1-32)

providers:
  claude:
    kind: anthropic
    model: claude-sonnet-5
    key_from: secrets.ANTHROPIC_API_KEY
  codex:
    kind: openai
    model: gpt-5.3-codex
    key_from: secrets.OPENAI_API_KEY
  opencode:
    kind: opencode
    model: big-pickle
    key_from: secrets.OPENCODE_API_KEY
    base_url: https://opencode.ai/zen/v1 # Go subscription: https://opencode.ai/zen/go/v1
                                     # Go FREE models change often: cat-jam-free
                                     # (review-capable; use this), space-bunny-free
                                     # (unavailable since 2026-10-13), longcat-2.5-preview-free
                                     # (returns prose instead of JSON on real diffs — avoid)
                                     # other Go models: glm-5.3-flash, kimi-k2.7-code, ...
    # retries: 2 # retry budget for empty/5xx/429/network (0-5, default 2)
    # timeout_s: 420 # per-attempt TOTAL cap, seconds (default 420); 90s idle + 60s/1KB trickle guards always on
    # Models tried in order when this one is unavailable, unknown, out of quota,
    # or still failing after its retries (max 5). Same transport + key; a step
    # is a bare id or { model, retries, timeout_s, json_mode, extra_body }.
    # Auth errors never fall back. The run's max_runtime_s covers the whole chain.
    # fallback_models:
    #   - glm-5.3-flash
    #   - { model: deepseek-v4.1-flash, extra_body: { reasoning_effort: "low" } }
    # Named per-model overrides sharing this entry's transport + credential
    # (agents use `provider: opencode.flash`). Each entry merges over the base;
    # only set keys win, so `{ model: ... }` alone keeps base retries/timeout.
    # models:
    #   flash:
    #     model: deepseek-v4-flash
    #   free:
    #     model: longcat-2.5-preview-free
    #     json_mode: false
    # Reasoning models spend thinking from the output budget — on a large diff
    # the think can eat the whole answer (empty content, finish_reason=length).
    # extra_body: { reasoning_effort: "low" } # cap the think, not the answer
  # Claude subscription (Pro/Max/Team/Enterprise) via OAuth instead of API key:
  # mint with `claude setup-token` (1-year token, sk-ant-oat01-…), store as a
  # secret, and pass it through the workflow step's `env:`. The explicit auth
  # block is honored literally (Bearer); without it, x-api-key is assumed.
  # claude-subscription:
  #   protocol: anthropic-messages
  #   model: claude-sonnet-5
  #   key_from: secrets.CLAUDE_CODE_OAUTH_TOKEN
  #   auth: { header: Authorization, scheme: Bearer }
  #   headers: { anthropic-beta: oauth-2025-04-20 }
  # Any OpenAI-compatible provider works with protocol + base_url + key_from + model:
  groq:
    protocol: openai-chat
    model: llama-3.3-70b-versatile
    base_url: https://api.groq.com/openai/v1
    key_from: secrets.GROQ_API_KEY
  # Azure OpenAI uses an api-key header with no scheme:
  azure:
    protocol: openai-chat
    model: my-deployment
    base_url: https://RESOURCE.openai.azure.com/openai/deployments/my-deployment
    key_from: secrets.AZURE_OPENAI_KEY
    auth: { header: api-key, scheme: "" }

reviews:
  - id: security-strict
    if_paths: ["auth/**", "api/**", "payments/**", "src/**"]
    strategy: any
    main:
      provider: codex
      instructions: "Staff security reviewer. Focus on OWASP, authz, injection, secrets. Only high-confidence findings."
    subagents:
      - name: secrets-scan
        provider: opencode
        instructions: "Find leaked secrets, hardcoded credentials, overly broad permissions."
      - name: logic-check
        provider: codex
        instructions: "Check auth flows, edge cases, error handling."
    verdict:
      mode: request_changes
      min_severity: high
      post_inline: true

  - id: general-quality
    if_paths: ["**"]
    strategy: majority
    profile: balanced # quiet | balanced | assertive (noise preset; explicit knobs below win)
    # min_confidence: 0.6
    # max_findings: 10
    # suppress: ["compat-date"] # decided items: rebutted patterns that must not resurrect
    # incremental: false # re-review only head-vs-last-reviewed-SHA on synchronize, carrying prior findings (opt-in)
    # suggest_fixes: false # set false to disable one-click fix blocks (default true)
    # Cross-file context (see website/docs/configuration): full changed files +
    # call-site excerpts are automatic (bounded by max_context_chars); add more:
    # context_files: ["src/types.ts", "db/schema.sql"]
    # include_full_files: true
    # max_context_chars: 20000
    # synthesize (default): subagents run first, then main merges/dismisses
    # their findings and writes the PR summary + walkthrough. parallel: main is
    # one more independent reviewer, no summary.
    main_mode: synthesize
    main:
      provider: claude
      instructions: "Synthesize sub-agent findings. Strict on bugs and correctness, lenient on style. Deduplicate."
    subagents:
      - name: correctness
        provider: claude
        instructions: "Bugs, race conditions, null handling, missing tests."
      - name: performance
        provider: opencode
        instructions: "N+1 queries, hot loops, unnecessary allocations, bundle size."
    verdict:
      mode: comment
      min_severity: medium
      post_inline: true
      deduplicate: true
      # consensus_escalation: true # escalate findings confirmed by 2+ agents one severity (opt-in; default false)

global_verdict:
  strategy: any_blocking
  sticky_comment: true
  sticky_comment_mode: update # update (default): one mutable status slot | append: per-run history sections
  fail_check_on_request_changes: false
